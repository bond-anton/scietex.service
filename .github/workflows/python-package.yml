# This workflow will install Python dependencies, run tests and lint with a variety of Python versions
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python

name: Python package

on:
  push:
    branches: ["main", "v3", "v5"]
  pull_request:
    branches: ["main", "v3", "v5"]

jobs:
  build:
    runs-on: ubuntu-latest

    # Service containers to run with `container-job`
    services:
      # Label used to access the service container
      redis:
        # Docker Hub image
        image: redis
        # Set health checks to wait until redis has started
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          # Maps port 6379 on service container to the host
          - 6379:6379
      # Broker backing the opt-in MQTT integration tier
      mosquitto:
        image: eclipse-mosquitto:2
        options: >-
          --health-cmd "mosquitto_sub -t '$SYS/broker/version' -C 1 -W 3"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 1883:1883

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.14"]

    steps:
      - uses: actions/checkout@v6
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .[dev,test]
      - name: Install with pip
        run: |
          pip install .
      - name: Test with pytest
        run: |
          pytest
        env:
          # Opt the real-server integration tiers in; both services above are
          # reachable on their default ports.
          SCIETEX_TEST_VALKEY_URL: localhost:6379
          SCIETEX_TEST_MQTT_HOST: localhost
          SCIETEX_TEST_MQTT_PORT: "1883"
