[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "scietex.service"
dynamic = ["version"]
description = "Scietex service daemon implementation"
authors = [{ name = "Anton Bondarenko", email = "bond.anton@gmail.com" }]
license-files = ["LICENSE"]
readme = "README.md"
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
]
requires-python = ">=3.10"
dependencies = [
  "msgspec>=0.20.0",
  # msgspec.yaml.encode/decode import PyYAML lazily at call time, so it is a
  # required runtime dependency for read_valkey_config even though no src/
  # module imports yaml directly.
  "pyyaml>=6.0",
  "scietex.logging>=1.1.0",
]

[project.urls]
"Homepage" = "https://github.com/bond-anton/scietex.service"
"Bug Tracker" = "https://github.com/bond-anton/scietex.service/issues"

[project.optional-dependencies]
valkey = ["scietex.logging[valkey]>=1.1.0", "valkey-glide~=2.5.0"]
dev = ["tox>=4.45.0", "valkey-glide~=2.5.0"]
test = ["pytest", "pytest-asyncio"]
lint = ["ruff", "ty"]

[tool.setuptools.dynamic]
version = { attr = "scietex.service.version.__version__" }

[tool.setuptools.package-data]
"scietex.service" = ["py.typed"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
addopts = "--capture=no"
